#
# Builds the full distribution matrix on a version tag (or manually). The bundle job runs on macOS because that
# is the one platform that can package both operating systems — exactly the same [latte bundle] a developer
# runs locally. The only CI-specific steps import signing credentials from secrets. Signing and notarization are
# required — the preflight fails the build when anything is missing — so every secret below must be configured.
#
# Secrets (all required):
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD          base64 .p12 with both Developer ID certificates, and its password
#   MACOS_SIGN_IDENTITY, MACOS_INSTALLER_IDENTITY  "Developer ID Application: ..." / "Developer ID Installer: ..."
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  notarization account (app-specific password)
name: Release

# The tag pattern matches what the Latte release-git plugin creates: the bare project version from project.latte
# with no [v] prefix (0.1.0, or 0.2.0-RC.1 for a prerelease). The trailing [*] admits the prerelease suffix.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/main/go/go.mod
      - name: Install latte
        run: |
          curl -fsSL https://lattejava.org/cli/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify the tag matches the project version
        if: github.ref_type == 'tag'
        run: |
          version="$(grep -o 'version: "[^"]*"' project.latte | head -1 | cut -d'"' -f2)"
          if [ "${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag [${GITHUB_REF_NAME}] does not match the project version [${version}]" >&2
            exit 1
          fi
      - name: Java tests
        run: latte test
      - name: Go checks
        run: |
          go vet -C src/main/go ./...
          go test -C src/main/go ./...

  bundle:
    needs: test
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/main/go/go.mod
      - name: Install latte
        run: |
          curl -fsSL https://lattejava.org/cli/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Import signing certificates
        if: env.MACOS_CERT_P12 != ''
        run: |
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          echo "$MACOS_CERT_P12" | base64 -d > cert.p12
          security import cert.p12 -k ci.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
          rm cert.p12
      - name: Store notarization credentials
        if: env.APPLE_ID != ''
        run: |
          xcrun notarytool store-credentials ci-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "MACOS_NOTARY_PROFILE=ci-notary" >> "$GITHUB_ENV"
      - name: Build
        run: latte bundle
      - name: Verify every platform produced artifacts
        run: |
          ls build/bundle/out
          for pattern in "*macos-arm64.pkg" "*macos-amd64.pkg" "*linux-amd64.tar.gz" "*linux-arm64.tar.gz"; do
            if ! ls build/bundle/out/$pattern > /dev/null 2>&1; then
              echo "Missing expected artifact [$pattern]" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: build/bundle/out/*
          if-no-files-found: error

  release:
    needs: bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: bundle/*
